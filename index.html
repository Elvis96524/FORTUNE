<script>
/* ==========================================================================
 * 1. 加载 lunar-javascript（CDN → 备用 CDN → 本地 ./lunar.js）
 * ======================================================================== */
const LUNAR_SRCS = [
  'https://cdn.jsdelivr.net/npm/lunar-javascript/lunar.js',
  'https://unpkg.com/lunar-javascript/lunar.js',
  './lunar.js'
];
function loadScript(src) {
  return new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = src; s.async = true;
    s.onload = () => resolve(src);
    s.onerror = () => { s.remove(); reject(new Error('load failed: ' + src)); };
    document.head.appendChild(s);
  });
}
function resolveLunarLib() {
  const g = globalThis;
  if (g.Solar && g.Lunar) return { Solar: g.Solar, Lunar: g.Lunar };
  for (const k of ['lunar', 'LunarJavascript', 'lunarJavascript']) {
    if (g[k] && g[k].Solar && g[k].Lunar) return { Solar: g[k].Solar, Lunar: g[k].Lunar };
  }
  return null;
}
async function ensureLunar() {
  let lib = resolveLunarLib();
  if (lib) return lib;
  for (const src of LUNAR_SRCS) {
    try { await loadScript(src); lib = resolveLunarLib(); if (lib) return lib; } catch (e) { /* try next */ }
  }
  return null;
}
</script>

<script>
/* ==========================================================================

const GAN = [...'甲乙丙丁戊己庚辛壬癸'];
const ZHI = [...'子丑寅卯辰巳午未申酉戌亥'];
const GAN_WX = { 甲:'木', 乙:'木', 丙:'火', 丁:'火', 戊:'土', 己:'土', 庚:'金', 辛:'金', 壬:'水', 癸:'水' };
const ZHI_WX = { 子:'水', 丑:'土', 寅:'木', 卯:'木', 辰:'土', 巳:'火', 午:'火', 未:'土', 申:'金', 酉:'金', 戌:'土', 亥:'水' };
const YANG = new Set([...'甲丙戊庚壬']);
const HIDDEN = { 子:'癸', 丑:'己癸辛', 寅:'甲丙戊', 卯:'乙', 辰:'戊乙癸', 巳:'丙庚戊', 午:'丁己', 未:'己丁乙', 申:'庚壬戊', 酉:'辛', 戌:'戊辛丁', 亥:'壬甲' };
const HID_W = { 1:[1], 2:[.7,.3], 3:[.6,.3,.1] };
const WX = ['木','火','土','金','水'];
const SHENG = { 木:'火', 火:'土', 土:'金', 金:'水', 水:'木' };   // 相生
const KE    = { 木:'土', 土:'水', 水:'火', 火:'金', 金:'木' };   // 相克
const WX_COLOR = { 木:'#5fbf7a', 火:'#e5584f', 土:'#d9a441', 金:'#d8d3c4', 水:'#5b8fd9' };

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const hiddenOf = z => { const l = [...HIDDEN[z]]; return l.map((gan, i) => ({ gan, w: HID_W[l.length][i] })); };

function shiShen(dm, g) {
  const a = GAN_WX[dm], b = GAN_WX[g], same = YANG.has(dm) === YANG.has(g);
  if (a === b) return same ? '比肩' : '劫财';
  if (SHENG[a] === b) return same ? '食神' : '伤官';
  if (KE[a] === b) return same ? '偏财' : '正财';
  if (KE[b] === a) return same ? '七杀' : '正官';
  return same ? '偏印' : '正印';
}

/* 命局分析：五行力量、日主强弱、喜忌五行 */
function analyzeChart(c) {
  const dm = c.d[0], dmEl = GAN_WX[dm];
  const el = { 木:0, 火:0, 土:0, 金:0, 水:0 };
  const ganW = { y:1, m:1.2, h:1 };                 // 日干本身另计
  const zhiW = { y:1, m:2.5, d:1.5, h:1.2 };        // 月令权重最高
  for (const k in ganW) el[GAN_WX[c[k][0]]] += ganW[k];
  for (const k in zhiW) for (const h of hiddenOf(c[k][1])) el[GAN_WX[h.gan]] += zhiW[k] * h.w;
  el[dmEl] += 1;
  const total = WX.reduce((s, e) => s + el[e], 0);
  const resEl = WX.find(x => SHENG[x] === dmEl);            // 印
  const outEl = SHENG[dmEl];                                // 食伤
  const wealthEl = KE[dmEl];                                // 财
  const officerEl = WX.find(x => KE[x] === dmEl);           // 官杀
  const ratio = (el[dmEl] + el[resEl]) / total;
  const strong = ratio >= 0.5;
  const FAV = {
    weak:   { 比劫:.8,  印:1,   食伤:-.3, 财:-.6, 官杀:-.9 },
    strong: { 比劫:-1,  印:-.8, 食伤:.8,  财:1,   官杀:.6 }
  }[strong ? 'strong' : 'weak'];
  const fav = { [dmEl]: FAV.比劫, [resEl]: FAV.印, [outEl]: FAV.食伤, [wealthEl]: FAV.财, [officerEl]: FAV.官杀 };
  const label = ratio >= .6 ? '身强' : ratio >= .5 ? '中和偏强' : ratio >= .4 ? '中和偏弱' : '身弱';
  const favorable = WX.filter(e => fav[e] > 0).sort((a, b) => fav[b] - fav[a]);
  const unfavorable = WX.filter(e => fav[e] < 0).sort((a, b) => fav[a] - fav[b]).slice(0, 2);
  return { dm, dmEl, el, total, ratio, strong, label, fav, favorable, unfavorable };
}

const pairHas = (list, a, b) => list.some(p => (p[0] === a && p[1] === b) || (p[0] === b && p[1] === a));

function branchRelations(a, b) {
  const r = [];
  if (pairHas(LIUHE, a, b)) r.push({ t:'六合', s:5 });

}

function hashStr(s) { let h = 2166136261; for (const c of s) { h ^= c.codePointAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }

  const ranked = [...WX].sort((x, y) => score[y] - score[x] || WX.indexOf(x) - WX.indexOf(y));
  const [e1, e2, e3] = ranked;
  const numbers = [...HETU[e1], HETU[e2][Math.floor(rnd() * 2)], HETU[e3][Math.floor(rnd() * 2)]];
  const k = Math.floor(rnd() * numbers.length);
  const rotated = numbers.slice(k).concat(numbers.slice(0, k));
  const colors = [
    { ...WX_COLORS[e1][0], el: e1 }, { ...WX_COLORS[e1][1], el: e1 }, { ...WX_COLORS[e2][0], el: e2 }
  ];
  return { elements: [e1, e2], numbers: rotated, colors };
}

/* 今日运势 = 命局喜忌 × 今日干支 + 地支合冲刑害 + 黄历吉凶 */
function dailyFortune(chart, today, almanac, seedKey, name) {
  const a = analyzeChart(chart);
  const dm = a.dm, dg = today.d[0], dz = today.d[1], mz = today.m[1];
  const favZhi = z => hiddenOf(z).reduce((s, h) => s + a.fav[GAN_WX[h.gan]] * h.w, 0);
  const fg = a.fav[GAN_WX[dg]], fz = favZhi(dz), fm = favZhi(mz);
  let total = (12 * fg + 12 * fz + 5 * fm) * .9;

  const notes = [];
  const PAL = { y:'年支', m:'月支', d:'日支', h:'时支' }, PW = { y:1, m:1, d:2, h:1 };
  let rel = 0;
  for (const k of ['y','m','d','h']) {
    const z = chart[k][1];
    for (const r of branchRelations(dz, z)) {
      rel += r.s * PW[k];
      notes.push({ t:r.t, s:r.s, text:`今日日支「${dz}」与你的${PAL[k]}「${z}」${r.t}` });
    }
  }
  total += clamp(rel, -16, 16);
  if (pairHas(HE5, dg, dm)) { total += 5; notes.push({ t:'天干合', s:5, text:`今日日干「${dg}」与你的日主「${dm}」相合` }); }
  else if (pairHas(GANCHONG, dg, dm)) { total -= 3; notes.push({ t:'天干冲', s:-3, text:`今日日干「${dg}」与你的日主「${dm}」相冲` }); }

  total += almanac.tianShenType === '黄道' ? 3 : almanac.tianShenType === '黑道' ? -3 : 0;
  total += ZX_SCORE[almanac.zhiXing] || 0;

  // 姓名加成：五格与八字喜用的契合、五格数理吉凶、三才配置、今日五行对人格的生克（合计限制在 ±8 分内）
  let nameInfo = null;

    const nb = nameBundle(a, name), E = nb.np.grids.ren.wx;
    const relDay = day => day === E ? 1 : SHENG[day] === E ? 2 : SHENG[E] === day ? -.5 : KE[day] === E ? -2 : .5;
    const daily = .67 * relDay(GAN_WX[dg]) + .33 * relDay(ZHI_WX[dz]);
    const parts = [
      { k:'与八字契合', v: 4 * nb.fit }, { k:'五格数理', v: 3 * nb.np.num },
      { k:'三才配置', v: 2 * nb.np.sancai }, { k:'今日五行', v: 1.25 * daily }
    ];
    const bonus = clamp(parts.reduce((s, p) => s + p.v, 0), -8, 8);
    total += bonus;
    const REL_TXT = { '2':'相生，得助', '1':'比和，同气相助', '0.5':'你克今日之气，略耗心力', '-0.5':'人格生今日之气，略有泄耗', '-2':'今日之气克人格，宜谨慎' };
    nameInfo = { ...nb, bonus: Math.round(bonus * 10) / 10, parts: parts.map(p => ({ k:p.k, v: Math.round(p.v * 10) / 10 })),
      dailyText: `今日日干「${dg}」属${GAN_WX[dg]}，与你的人格（${E}）${REL_TXT[relDay(GAN_WX[dg])]}` };
  }

  const score = clamp(Math.round(62 + total), 35, 98);
  const level = LEVELS.find(l => score >= l.min);
  const ssGan = shiShen(dm, dg), ssZhi = shiShen(dm, hiddenOf(dz)[0].gan);

  const T = SS_TEXT[ssGan];
  const hasClash = notes.some(n => n.s <= -7), hasHe = notes.some(n => n.t === '六合' || n.t === '半合' || n.t === '天干合');
  let mood = T.mood;

  else if (hasHe) mood += ' 地支逢合，人际氛围融洽，易得助力。';
  const tip = fg > .3 ? `今日天干${GAN_WX[dg]}为你的喜用，顺势而为即可。`
            : fg < -.3 ? `今日天干${GAN_WX[dg]}偏逆你的喜用，宜稳不宜急，多留余地。`
            : `今日天干${GAN_WX[dg]}与你的命局关系平和。`;

  return {
    a, score, level, ssGan, ssZhi, tip, notes, mood,
    career: T.career, wealth: T.wealth,
    lucky: luckyOf(a, today, seedKey),
    name: nameInfo
  };
}

/* 十神分布（比劫 / 食伤 / 财 / 官杀 / 印 各占比，总和为 1） */
function godDist(c) {
  const dm = c.d[0], d = { 比劫:0, 食伤:0, 财:0, 官杀:0, 印:0 };
  const ganW = { y:1, m:1.2, h:1 }, zhiW = { y:1, m:2.5, d:1.5, h:1.2 };
  for (const k in ganW) d[SS_GROUP[shiShen(dm, c[k][0])]] += ganW[k];
  for (const k in zhiW) for (const h of hiddenOf(c[k][1])) d[SS_GROUP[shiShen(dm, h.gan)]] += zhiW[k] * h.w;
  d.比劫 += 1;                                       // 日主自身
  const t = Object.values(d).reduce((s, v) => s + v, 0);
  for (const k in d) d[k] /= t;
  return d;
}

/* 某一步大运 / 流年干支与命局的契合度 */
function periodScore(a, chart, gz) {
  const dm = a.dm, g = gz[0], z = gz[1];
  const favZhi = zz => hiddenOf(zz).reduce((s, h) => s + a.fav[GAN_WX[h.gan]] * h.w, 0);
  let total = (10 * a.fav[GAN_WX[g]] + 10 * favZhi(z)) * .9;
  const PAL = { y:'年支', m:'月支', d:'日支', h:'时支' }, PW = { y:1, m:1, d:2, h:1 };
  const notes = []; let rel = 0;
  for (const k of ['y','m','d','h']) {
    for (const r of branchRelations(z, chart[k][1])) {
      rel += r.s * PW[k];
      notes.push({ t:r.t, s:r.s, text:`${z}${r.t}${PAL[k]}${chart[k][1]}` });
    }
  }
  total += clamp(rel, -14, 14);
  if (pairHas(HE5, g, dm)) { total += 4; notes.push({ t:'天干合', s:4, text:`${g}合日主${dm}` }); }
  else if (pairHas(GANCHONG, g, dm)) { total -= 2; notes.push({ t:'天干冲', s:-2, text:`${g}冲日主${dm}` }); }
  return { score: clamp(Math.round(62 + total), 38, 96), ss: shiShen(dm, g), ssZhi: shiShen(dm, hiddenOf(z)[0].gan), notes };
}

function healthReading(a) {

  else parts.push(`${weak.e}行相对偏弱（约${pct(weak.v)}%），宜多留意${ORGAN[weak.e]}的保养。`);

             ss: p.ss, ssZhi: p.ssZhi, score: p.score, level: levelOf(p.score), text: DECADE_TEXT[p.ss], notes: p.notes, years,
             nameAdj: nb ? Math.round(adj * 10) / 10 : null };

  let curIdx = cycles.findIndex(c => curYear >= c.startYear && curYear <= c.endYear);
  const pre = curIdx < 0 && cycles.length > 0 && curYear < cycles[0].startYear;
  if (curIdx < 0) curIdx = pre ? 0 : Math.max(cycles.length - 1, 0);

  const lifeScore = cycles.length ? Math.round(cycles.reduce((s, c) => s + c.score, 0) / cycles.length) : 0;

    numbers: [...HETU[favs[0]], ...HETU[favs[1]]],
    colors: [{ ...WX_COLORS[favs[0]][0], el: favs[0] }, { ...WX_COLORS[favs[0]][1], el: favs[0] }, { ...WX_COLORS[favs[1]][0], el: favs[1] }],
    directions: favs.map(e => `${e}：${DIRECTION[e]}`),
    industries: favs.map(e => ({ el: e, text: INDUSTRY[e] }))
  };

  return {
    a, dist, gender, age: curYear - birthYear + 1, pre, curIdx, bestIdx, worstIdx, lifeScore, lifeLevel: levelOf(lifeScore || 0),
    personality: DM_TRAIT[dm],
    pattern: { name: PATTERN[ssMonth].name, ss: ssMonth, text: PATTERN[ssMonth].text },
    domains: { career, wealth, love: loveReading(chart, a, gender, dist), health: healthReading(a) },
    cycles, lucky,
    name: nb && { ...nb, stages: STAGE_DEF.map(s => ({ ...s, grid: nb.np.grids[s.k], adj: Math.round(stageGridAdj(a, nb.np.grids[s.k]) * 10) / 10 })) }
  };
}

/* ==========================================================================
 * 姓名五格（熊崎式）：天格 / 人格 / 地格 / 外格 / 总格，并与八字喜用对照
 * 笔画按《康熙字典》（繁体）计；内置少量常见字作“参考预填”，其余由用户填写
 * ======================================================================== */
const SURNAME_STROKES = {
  王:4, 李:7, 张:11, 刘:15, 陈:16, 杨:13, 黄:12, 赵:14, 吴:7, 周:8, 徐:10, 孙:10, 马:10, 朱:6, 胡:9, 郭:15, 何:7, 林:8,
  高:10, 罗:19, 郑:19, 梁:11, 谢:17, 宋:7, 唐:10, 许:11, 韩:17, 冯:12, 邓:19, 曹:11, 彭:12, 曾:12, 田:5, 董:15, 袁:10,
  潘:16, 于:3, 蒋:17, 蔡:17, 余:7, 杜:7, 叶:15, 程:12, 苏:22, 魏:18, 吕:7, 丁:2, 任:6, 沈:8, 姚:9, 卢:16, 姜:9, 崔:11,
  钟:17, 谭:19, 陆:16, 汪:8, 范:15, 金:8, 石:5, 廖:14, 贾:13, 夏:10, 韦:9, 傅:12, 方:4, 白:5, 邹:17, 孟:8, 熊:14,
  秦:10, 邱:12, 江:7, 尹:4, 薛:19, 段:9, 雷:13, 侯:9, 龙:16, 史:5, 陶:16, 黎:15, 贺:12, 顾:21, 毛:4, 郝:14, 龚:22,
  邵:12, 万:15, 钱:16, 严:20, 武:8, 戴:18, 赖:16, 洪:10
};
const GIVEN_STROKES = {
  一:1, 二:2, 三:3, 大:3, 小:3, 子:3, 才:3, 山:3, 天:4, 文:4, 心:4, 水:4, 日:4, 月:4, 木:4, 玉:5, 平:5, 立:5, 正:5, 民:5, 永:5, 世:5,
  光:6, 安:6, 宇:6, 志:7, 秀:7, 宏:7, 明:8, 欣:8, 佳:8, 俊:9, 怡:9, 美:9, 建:9, 军:9, 勇:9, 红:9, 思:9, 玲:10, 芳:10, 轩:10,
  刚:10, 娜:10, 洋:10, 浩:11, 婉:11, 国:11, 海:11, 英:11, 敏:11, 梅:11, 晨:11, 梓:11, 伟:12, 华:12, 杰:12, 婷:12, 雅:12,
  凯:12, 强:12, 涵:12, 博:12, 琳:13, 莉:13, 诗:13, 宁:14, 睿:14, 瑞:14, 嘉:14, 慧:15, 磊:15, 萱:15, 静:16, 燕:16, 涛:18,
  丽:19, 鹏:19, 兰:23
};
const STROKES = { ...GIVEN_STROKES, ...SURNAME_STROKES };

// 81 数理吉凶（传统熊崎式，各家略有出入）：吉 / 半（半吉）/ 凶
const LUCK81 = '吉凶吉凶吉吉吉吉凶凶' + '吉凶吉凶吉吉吉吉凶凶' + '吉凶吉吉吉凶半凶半半' + '吉吉吉凶吉凶吉半吉半' + '吉半凶凶吉凶吉吉半半'
             + '半吉半凶半凶吉半凶凶' + '半凶吉凶吉凶吉吉凶凶' + '半凶半凶半凶半半凶凶' + '吉';
const LUCK_VAL = { 吉: 1, 半: .5, 凶: -1 };
const LUCK_LABEL = { 吉: '吉', 半: '半吉', 凶: '凶' };
const numWx = n => ['水','木','木','火','火','土','土','金','金','水'][n % 10];     // 1,2木 3,4火 5,6土 7,8金 9,0水
const reduce81 = n => { while (n > 81) n -= 80; return n; };
const GRID_META = {
  tian: { n:'天格', d:'先天基础与祖荫' },
  ren:  { n:'人格', d:'主运：性格与中年运' },
  di:   { n:'地格', d:'前运：早年与根基' },
  wai:  { n:'外格', d:'副运：人际与贵人' },
  zong: { n:'总格', d:'总运：一生与晚年' }
};
const STAGE_DEF = [
  { k:'di',   label:'前运', ages:'约 30 岁前',   g:'地格' },
  { k:'ren',  label:'中运', ages:'约 30–49 岁', g:'人格' },
  { k:'zong', label:'后运', ages:'约 50 岁起',   g:'总格' }
];
const stageKey = age => age < 30 ? 'di' : age < 50 ? 'ren' : 'zong';

function nameGrids(st, surLen) {
  const sur = st.slice(0, surLen), giv = st.slice(surLen), sum = l => l.reduce((s, v) => s + v, 0);
  const raw = {
    tian: surLen === 1 ? sur[0] + 1 : sur[0] + sur[1],
    ren:  sur[surLen - 1] + giv[0],
    di:   giv.length === 1 ? giv[0] + 1 : giv[0] + giv[1],
    wai:  surLen === 1 ? (giv.length === 1 ? 2 : giv[1] + 1) : (giv.length === 1 ? sur[0] + 1 : sur[0] + giv[1]),
    zong: sum(st)
  };
  const g = {};
  for (const k in raw) {
    const n = reduce81(raw[k]), luck = LUCK81[n - 1];
    g[k] = { n, raw: raw[k], wx: numWx(n), luck, lv: LUCK_VAL[luck], label: LUCK_LABEL[luck] };
  }
  return g;
}

/* 三才（天人地五行）：相生 +1，比和 +.5，逆生 -.2，相克 -1 */
function sancaiRel(a, b) {
  if (a === b) return .5;
  if (SHENG[a] === b) return 1;
  if (SHENG[b] === a) return -.2;
  return -1;
}

function nameBundle(a, name) {
  const grids = nameGrids(name.strokes, name.surLen);
  const wFit = { ren: .35, di: .2, zong: .2, wai: .15, tian: .1 };
  const wNum = { ren: .35, di: .2, zong: .25, wai: .2 };
  let fit = 0, num = 0;
  for (const k in wFit) fit += wFit[k] * a.fav[grids[k].wx];
  for (const k in wNum) num += wNum[k] * grids[k].lv;
  const sancai = .4 * sancaiRel(grids.tian.wx, grids.ren.wx) + .6 * sancaiRel(grids.ren.wx, grids.di.wx);
  const sancaiText = sancai >= .6 ? '三才相生，基础顺遂、做事得助' : sancai >= .2 ? '三才平和，发展较为稳定'
                   : sancai > -.3 ? '三才平平，成败更多取决于自身努力' : '三才相克，过程中易有阻滞，宜稳扎稳打';
  const fitText = fit >= .35 ? '姓名五行与八字喜用相合，名字对命局有补益。'
                : fit >= .1 ? '姓名五行与命局基本协调。'
                : fit > -.15 ? '姓名与命局关系平和，影响不大。'
                : '姓名五行与命局喜用略有冲突，可在日常用色、方位上适当补足。';
  const helpful = ['ren', 'di', 'zong', 'wai', 'tian'].filter(k => a.fav[grids[k].wx] > 0);
  return { np: { grids, num, sancai, sancaiText, sancaiWx: [grids.tian.wx, grids.ren.wx, grids.di.wx] },
           fit, fitText, helpful, chars: name.chars, strokes: name.strokes, surLen: name.surLen };
}

/* 某一格对某阶段运势的加减分（±4.5 以内） */
function stageGridAdj(a, g) { return clamp(2.5 * a.fav[g.wx] + 2 * g.lv, -4.5, 4.5); }

/* 解析并校验姓名输入；两项都为空返回 null（表示不使用姓名） */
function parseName(sur, giv, strokes) {
  sur = (sur || '').trim(); giv = (giv || '').trim();
  if (!sur && !giv) return null;
  if (!sur || !giv) throw new Error('请同时填写姓和名，或两项都留空');
  const HAN = /^[㐀-鿿]+$/;
  if (!HAN.test(sur) || !HAN.test(giv)) throw new Error('姓名请输入汉字');
  const sc = [...sur], gc = [...giv];
  if (sc.length > 2 || gc.length > 2) throw new Error('姓最多 2 字（复姓），名最多 2 字');
  const chars = sc.concat(gc);
  if (!Array.isArray(strokes) || strokes.length !== chars.length) throw new Error('笔画数量与姓名字数不一致');
  const nums = chars.map((ch, i) => {
    const s = String(strokes[i] ?? '').trim(), n = Number(s);
    if (s === '' || !Number.isInteger(n) || n < 1 || n > 40) throw new Error(`请填写「${ch}」的康熙笔画（1–40 的整数）`);
    return n;
  });
  return { sur, giv, surLen: sc.length, chars, strokes: nums };
}
// ==CORE-END==
</script>

<script>

    y: safe(() => ec.getYearNaYin(), ''), m: safe(() => ec.getMonthNaYin(), ''),

/* ---- 渲染 ---- */
const elTag = e => `<span style="color:${WX_COLOR[e]}">${e}</span>`;

const nameTodayExtra = nm => `
  <div class="mt-4 border-t border-ink-600 pt-4">

/* ---- 一生运程渲染 ---- */
const SCORE_COLOR = s => s >= 76 ? '#d4af37' : s >= 62 ? '#d6d3d1' : '#e0525a';
const gzSpan = gz => `<span style="color:${WX_COLOR[GAN_WX[gz[0]]]}">${gz[0]}</span><span style="color:${WX_COLOR[ZHI_WX[gz[1]]]}">${gz[1]}</span>`;

function lifeCurve(life) {
  const cs = life.cycles, n = cs.length;
  const W = 640, H = 230, pl = 34, pr = 22, pt = 22, pb = 48;
  const xs = i => pl + (n === 1 ? (W - pl - pr) / 2 : i * (W - pl - pr) / (n - 1));
  const ys = s => pt + (98 - s) / 63 * (H - pt - pb);
  const cw = n === 1 ? W - pl - pr : (W - pl - pr) / (n - 1);      // 每个大运一整列点击热区
  const pts = cs.map((c, i) => [xs(i), ys(c.score)]);
  const line =pts.map((p, i) => `${i ? 'L' : 'M'}${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(' ');
  const area = `${line} L${pts[n - 1][0].toFixed(1)},${H - pb} L${pts[0][0].toFixed(1)},${H - pb} Z`;
  const grid = [50, 70, 90].map(v => `<line x1="${pl}" x2="${W - pr}" y1="${ys(v).toFixed(1)}" y2="${ys(v).toFixed(1)}" stroke="#2e2937" stroke-dasharray="3 4"/><text x="${pl - 6}" y="${(ys(v) + 4).toFixed(1)}" text-anchor="end" font-size="11" fill="#78716c">${v}</text>`).join('');
  const dots = cs.map((c, i) => {
    const x = pts[i][0].toFixed(1), y = pts[i][1].toFixed(1), isCur = i === life.curIdx, isSel = i === life.sel;
    return `<g data-idx="${i}" style="cursor:pointer">
      <title>${c.gz}运 ${c.startAge}–${c.endAge}岁 · ${c.score}分（${c.level.name}）</title>
      <rect x="${(pts[i][0] - cw / 2).toFixed(1)}" y="0" width="${cw.toFixed(1)}" height="${H}" fill="transparent"/>
      ${isSel ? `<circle cx="${x}" cy="${y}" r="11" fill="none" stroke="#d4af37" stroke-width="1.5"/>` : ''}
      <circle cx="${x}" cy="${y}" r="${isCur ? 6.5 : 5}" fill="${SCORE_COLOR(c.score)}" stroke="#0a090d" stroke-width="2"/>
      <text x="${x}" y="${(pts[i][1] - 13).toFixed(1)}" text-anchor="middle" font-size="11" fill="#d6d3d1">${c.score}</text>
      <text x="${x}" y="${H - pb + 17}" text-anchor="middle" font-size="12" fill="${isCur ? '#e0bc5a' : '#a8a29e'}" font-weight="${isCur ? 700 : 400}">${c.gz}</text>
      <text x="${x}" y="${H - pb + 31}" text-anchor="middle" font-size="10" fill="#78716c">${c.startAge}岁</text>
      ${isCur ? `<text x="${x}" y="${H - pb + 43}" text-anchor="middle" font-size="10" fill="#e0bc5a">当前</text>` : ''}
    </g>`;
  }).join('');
  return `<svg viewBox="0 0 ${W} ${H}" class="w-full" role="img" aria-label="一生大运运势曲线">
    <defs><linearGradient id="lg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d4af37" stop-opacity=".28"/><stop offset="1" stop-color="#d4af37" stop-opacity="0"/></linearGradient></defs>
    ${grid}<path d="${area}" fill="url(#lg)"/><path d="${line}" fill="none" stroke="#d4af37" stroke-width="2.2" stroke-linejoin="round"/>${dots}
  </svg>`;
}

function drawCycles(life) {
  $('lifeCycles').innerHTML = life.cycles.map((c, i) => `
    <div class="cyc rounded-xl border p-3 ${i === life.sel ? 'border-gold-500/80 bg-gold-500/5' : 'border-ink-600 bg-ink-900/60'}" data-idx="${i}" tabindex="0" role="button" aria-pressed="${i === life.sel}">
      <div class="flex items-baseline justify-between">
        <div class="text-2xl font-bold">${gzSpan(c.gz)}</div>
        ${i === life.curIdx ? '<span class="rounded bg-crimson-500 px-1.5 py-0.5 text-[10px] text-white">当前</span>' : ''}
      </div>
      <div class="mt-0.5 text-[11px] text-gold-400">${c.ss}运 · 支藏${c.ssZhi}</div>
      <div class="text-xs text-stone-400">${c.startAge}–${c.endAge}岁 · ${c.startYear}–${c.endYear}</div>
      <div class="mt-1.5 flex items-center gap-2"><span class="text-lg font-bold" style="color:${SCORE_COLOR(c.score)}">${c.score}</span><span class="text-xs text-stone-400">${c.level.name}</span></div>
      <p class="mt-1.5 text-xs leading-relaxed text-stone-400">${c.text}</p>
      ${c.nameAdj != null ? `<div class="mt-1 text-[10px] ${c.nameAdj >= 0 ? 'text-gold-300' : 'text-crimson-400'}">姓名 ${signed(c.nameAdj)}</div>` : ''}
      ${c.notes.length ? `<div class="mt-2 flex flex-wrap gap-1">${c.notes.slice(0, 3).map(n => `<span class="rounded border px-1.5 py-0.5 text-[10px] ${n.s > 0 ? 'border-gold-500/40 text-gold-300' : 'border-crimson-500/50 text-crimson-400'}">${n.text}</span>`).join('')}</div>` : ''}
    </div>`).join('');
}

function drawYears(life) {
  const c = life.cycles[life.sel], ys = c.years;
  const head = `<h3 class="mb-3 text-gold-300"><b>${c.gz}</b> 运（${c.startAge}–${c.endAge}岁）逐年流年</h3>`;
  if (!ys.length) { $('lifeYears').innerHTML = head + '<p class="text-sm text-stone-500">暂无流年数据。</p>'; return; }
  const bars = ys.map(y => `
    <div class="flex flex-col items-center gap-1" title="${y.year}年 ${y.gz} · ${y.ss}年 · ${y.score}分">
      <span class="text-[11px] ${y.isNow ? 'font-bold text-gold-300' : 'text-stone-400'}">${y.score}</span>
      <div class="flex h-24 w-full items-end"><div class="w-full rounded-t" style="height:${Math.round((y.score - 30) / 70 * 100)}%;background:${SCORE_COLOR(y.score)};opacity:${y.isNow ? 1 : .55}"></div></div>
      <span class="text-[11px] ${y.isNow ? 'font-bold text-gold-300' : 'text-stone-300'}">${y.gz}</span>
      <span class="text-[10px] text-stone-500">${String(y.year).slice(2)}年</span>
    </div>`).join('');
  const best = ys.reduce((m, y) => y.score > m.score ? y : m, ys[0]);
  const worst = ys.reduce((m, y) => y.score < m.score ? y : m, ys[0]);
  $('lifeYears').innerHTML = head +
    `<div class="grid gap-1" style="grid-template-columns:repeat(${ys.length},minmax(0,1fr))">${bars}</div>
     <p class="mt-3 text-xs leading-relaxed text-stone-400">此运中相对更顺的是 <b class="text-gold-300">${best.year}</b> 年（${best.gz}），宜多把握；相对需谨慎的是 <b class="text-crimson-400">${worst.year}</b> 年（${worst.gz}），宜稳健行事。流年按农历年干支，并叠加所在大运的影响。</p>`;
}

function selectCycle(i) {
  if (!LIFE || !LIFE.cycles[i]) return;
  LIFE.sel = i;
  $('lifeCurve').innerHTML = lifeCurve(LIFE);
  drawCycles(LIFE); drawYears(LIFE);
}

    <div class="grid gap-6 sm:grid-cols-2">
      <div>
        <div class="mb-2 text-xs text-stone-500">幸运数字</div>
        <div class="flex flex-wrap gap-3">${life.lucky.numbers.map(n => `<div class="flex h-11 w-11 items-center justify-center rounded-full border border-gold-500/60 bg-gold-500/10 text-lg font-bold text-gold-300">${n}</div>`).join('')}</div>
        <div class="mb-2 mt-5 text-xs text-stone-500">有利方位</div>
        <p class="text-sm text-stone-300">${life.lucky.directions.join('　')}</p>
      </div>
      <div>
        <div class="mb-2 text-xs text-stone-500">幸运色</div>
        <div class="space-y-2.5">
          ${life.lucky.colors.map(c => `
            <div class="flex items-center gap-3">
              <span class="h-9 w-9 rounded-lg border border-white/20 shadow-inner" style="background:${c.hex}"></span>
              <span class="text-stone-200">${c.name}</span>
              <span class="text-xs text-stone-500">${c.hex} · 属${c.el}</span>
            </div>`).join('')}
        </div>
      </div>
    </div>
    <div class="mt-5 border-t border-ink-600 pt-4">
      <div class="mb-2 text-xs text-stone-500">适合发展的行业方向</div>
      ${life.lucky.industries.map(i => `<p class="text-sm leading-relaxed text-stone-300"><span style="color:${WX_COLOR[i.el]}">${i.el}</span>　${i.text}</p>`).join('')}
    </div>
  </section>`;
  $('lifeCurve').innerHTML = lifeCurve(life);
  drawCycles(life); drawYears(life);
  $('result').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function setMode(m) {
  MODE = m;
  $('tabToday').setAttribute('aria-selected', String(m === 'today'));
  $('tabLife').setAttribute('aria-selected', String(m === 'life'));
  $('genderWrap').style.display = m === 'life' ? 'block' : 'none';
  $('btnLabel').textContent = m === 'life' ? '测算一生运程' : '测算今日运势';
  $('result').innerHTML = ''; LIFE = null;
  try { const s = JSON.parse(localStorage.getItem(STORE_KEY) || '{}'); s.mode = m; localStorage.setItem(STORE_KEY, JSON.stringify(s)); } catch (e) {}
}

function showError(e) {
  console.warn(e);
  $('result').innerHTML = `<div class="card p-5 text-sm text-crimson-400">测算失败：${e.message || e}</div>`;
}

function onCalc() {
  const input = { y: +$('selYear').value, m: +$('selMonth').value, d: +$('selDay').value, h: +$('selHour').value, g: +$('selGender').value, mode: MODE,
                  sur: $('inSur').value.trim(), giv: $('inGiv').value.trim(), sm: STROKE_MEM };
  try { localStorage.setItem(STORE_KEY, JSON.stringify(input)); } catch (e) {}
  try {
    const name = getName();                       // 姓名留空则为 null；填写有误会抛出明确提示
    const chartInfo = buildChart(input.y, input.m, input.d, input.h);
    if (MODE === 'life') {
      const gender = +input.g;
      const dayun = getDaYunList(chartInfo.ec, gender);
      const life = lifetimeReading(chartInfo.chart, gender, dayun, input.y, new Date().getFullYear(), name);
      if (!life.cycles.length) throw new Error('未能取得大运数据');
      renderLife(input, chartInfo, dayun, life);
      return;
    }
    const today = getToday();
    const alm = getAlmanac(today.lunar);
    const key = `${input.y}-${input.m}-${input.d}-${input.h}|${today.now.getFullYear()}-${today.now.getMonth()}-${today.now.getDate()}`;
    const res = dailyFortune(chartInfo.chart, today.pillars, alm, key, name);
    render(input, chartInfo, today, alm, res);
  } catch (e) { showError(e); }
}

/* ---- 启动 ---- */
(async function init() {
  fillSelects();
  $('selYear').addEventListener('change', () => fillDays());
  $('selMonth').addEventListener('change', () => fillDays());
  $('btnCalc').addEventListener('click', onCalc);
  $('inSur').addEventListener('input', renderStrokeBox);
  $('inGiv').addEventListener('input', renderStrokeBox);
  $('strokeBox').addEventListener('input', e => {
    const t = e.target;
    if (t.classList && t.classList.contains('stk')) STROKE_MEM[t.dataset.ch] = t.value;
  });
  renderStrokeBox();
  $('tabToday').addEventListener('click', () => setMode('today'));
  $('tabLife').addEventListener('click', () => setMode('life'));
  $('result').addEventListener('click', e => { const t = e.target.closest('[data-idx]'); if (t) selectCycle(+t.dataset.idx); });
  $('result').addEventListener('keydown', e => {
    if (e.key !== 'Enter' && e.key !== ' ') return;
    const t = e.target.closest('.cyc[data-idx]'); if (t) { e.preventDefault(); selectCycle(+t.dataset.idx); }
  });
  setMode(MODE);
  $('todayLine').textContent = new Date().toLocaleDateString('zh-CN', { year:'numeric', month:'long', day:'numeric', weekday:'long' });

  $('btnCalc').disabled = true;
  LJ = await ensureLunar();
  if (LJ) {
    $('btnCalc').disabled = false;
    const t = safe(() => LJ.Lunar.fromDate(new Date()), null);
    if (t) {
      const ec = t.getEightChar();
      $('todayLine').textContent += `　·　${ec.getYear()}年 ${ec.getMonth()}月 ${ec.getDay()}日`;
    }
  } else {
    const b = $('libBanner');
    b.classList.remove('hidden');
    b.innerHTML = '无法加载 <b>lunar-javascript</b>。请检查网络，或执行 <code>npm i lunar-javascript</code> 后把 <code>node_modules/lunar-javascript/lunar.js</code> 复制到本页同目录再刷新。';
  }
})();
</script>

<!-- PWA：Service Worker 注册、更新提示、安装按钮 -->
<script>
(function () {
  // Service Worker 只能在 https 或 localhost 下工作（GitHub Pages 是 https）
  const canSW = 'serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1');

  function showUpdateBanner(worker) {
    if (document.getElementById('swBanner')) return;
    const bar = document.createElement('div');
    bar.id = 'swBanner';
    bar.setAttribute('role', 'status');
    bar.className = 'fixed inset-x-4 bottom-4 z-50 mx-auto flex max-w-md items-center justify-between gap-3 rounded-xl border border-gold-500/50 bg-ink-800 px-4 py-3 text-sm text-stone-200 shadow-xl';
    bar.innerHTML = '<span>发现新版本</span><span class="flex gap-2"><button type="button" id="swLater" class="rounded-lg px-3 py-1 text-stone-400 hover:text-stone-200">稍后</button><button type="button" id="swNow" class="rounded-lg bg-gold-500 px-3 py-1 font-bold text-ink-950">立即更新</button></span>';
    document.body.appendChild(bar);
    document.getElementById('swLater').onclick = () => bar.remove();
    document.getElementById('swNow').onclick = () => { window.__swUserAccepted = true; worker.postMessage({ type: 'SKIP_WAITING' }); };
  }

  if (canSW) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').then(reg => {
        window.__swReg = reg;
        if (reg.waiting && navigator.serviceWorker.controller) showUpdateBanner(reg.waiting);
        reg.addEventListener('updatefound', () => {
          const nw = reg.installing;
          if (!nw) return;
          nw.addEventListener('statechange', () => {
            if (nw.state === 'installed' && navigator.serviceWorker.controller) showUpdateBanner(nw);
          });
        });
      }).catch(err => console.warn('Service Worker 注册失败：', err));
      // 仅在用户点了“立即更新”之后才刷新，避免首次安装时无故重载
      navigator.serviceWorker.addEventListener('controllerchange', () => { if (window.__swUserAccepted) location.reload(); });
    });
  }

  // “安装到桌面”按钮（Chrome / Edge / Android；iOS 请用分享菜单“添加到主屏幕”）
  let deferred = null;
  const btn = document.getElementById('btnInstall');
  window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferred = e; btn.classList.remove('hidden'); });
  btn.addEventListener('click', async () => {
    if (!deferred) return;
    deferred.prompt();
    try { await deferred.userChoice; } catch (e) {}
    deferred = null; btn.classList.add('hidden');
  });
  window.addEventListener('appinstalled', () => btn.classList.add('hidden'));
})();
</script>
